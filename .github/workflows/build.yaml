name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkplate10-weather-cal

    steps:
      # Checked out side by side so lib_deps' symlink://../epd/... paths
      # resolve. The client's own tests live in epd and run in its CI.
      - uses: actions/checkout@v6
        with:
          path: inkplate10-weather-cal
          # Tags, so scripts/version.py can derive CLIENT_VERSION.
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: chrisjtwomey/epd
          path: epd
          # The firmware libraries come from the registry, but the host tests
          # compile epd's sources directly. Same version either way.
          ref: v0.3.1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Create defaults.cpp from example
        run: cp src/defaults.example.cpp src/defaults.cpp

      - name: Build firmware (debug + release)
        run: pio run

      # This project's own logic, on the host: the order of a wake, and what
      # it draws over a page. Neither runs in epd's CI, because neither is
      # epd's to decide.
      - name: Run host tests
        run: |
          pio test -e native_integration
          pio test -e native_panel

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
