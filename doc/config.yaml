# The settings file for the SD card build (release_sdcard). Put it in the root
# of the card, as config.yaml. Replace the example values with your own.
#
# server.url, wifi.ssid and wifi.pass are required: without all three, the
# display ignores the file. A key the file leaves out keeps the firmware's value.
server:
  # The page the display shows at its first start. After that, the server says
  # which page comes next. Pages: today.png, tomorrow.png, current.png,
  # hourly.png, daily.png.
  url: http://192.168.1.10:8080/today.png
  # How many more times to try to download and draw a page.
  retries: 3
  # How long to sleep, in seconds, when the server has not said: at the first
  # start, or when every try failed.
  default_refresh_seconds: 3600
wifi:
  ssid: XXXX
  pass: XXXX
  # How long to wait for Wi-Fi, in seconds, before giving up on this wake.
  connect_timeout_seconds: 10
mqtt_logger:
  # true sends the display's log to an MQTT broker.
  enabled: false
  # broker, clientId and prefix come together: give all three, or the display
  # keeps its own. The display logs to <prefix>/inkplate10-weather-cal.
  broker: 192.168.1.10
  clientId: inkplate10-weather-cal
  prefix: mqtt/weather-cal
  port: 1883
  # How many more times to try the broker. Each try can hold the wake about
  # 3 s, so keep it low on a battery.
  retries: 3
