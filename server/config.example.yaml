---
server:
  port: 8080
  # IANA timezone in which display.schedule times are interpreted
  # (e.g. Europe/Dublin, Europe/London, America/New_York). Handles DST transitions
  # automatically. If omitted, the server's OS-level timezone is used (UTC in
  # Docker by default, which is rarely what you want).
  timezone: Europe/Dublin
  # Seconds before each scheduled wake time at which the server regenerates
  # the corresponding image. Defaults to 120 (2 minutes) if omitted.
  regen_lead_seconds: 120
# What the client shows, and when. Each pool is a list of images read in
# turn; here every pool is one image. The schedule names a pool at each wake
# time (HH:MM:SS, in server.timezone). The server regenerates the image
# regen_lead_seconds before the wake, then tells the client the next wake
# time and URL in the X-Next-Refresh-Seconds and X-Next-URL headers.
# Defaults to today.png at 09:00:00 if omitted.
display:
  pools:
    today: [today.png]
    hourly: [hourly.png]
    daily: [daily.png]
    current: [current.png]
    tomorrow: [tomorrow.png]
  schedule:
    type: times
    "08:00:00": today
    "10:00:00": hourly
    "12:00:00": daily
    "14:00:00": current
    "16:00:00": daily
    "18:00:00": hourly
    "20:00:00": tomorrow
weather:
  service: accuweather
  apikey: XXXX
  num_hourly_forecasts: 9
  metric: true
google:
  apikey: XXXX
  staticmaps_mapid: XXXX
location: Dublin
image:
  # Final generated PNG width (pixels).
  width: 825
  # Final generated PNG height (pixels).
  height: 1200
  # Inner layout bounds width (pixels). Page HTML is constrained to this box.
  # Must be <= width.
  innerWidth: 825
  # Inner layout bounds height (pixels). Content outside this box is clipped.
  # Must be <= height.
  innerHeight: 1200
  # Horizontal alignment for the inner bounds within the full canvas.
  # Allowed: left, center, right.
  innerAlignX: center
  # Vertical alignment for the inner bounds within the full canvas.
  # Allowed: top, center, bottom.
  innerAlignY: center
# Server-driven firmware updates. The board is offered the image on its
# next page fetch, and flashes itself after it has drawn.
firmware:
  enabled: false
  # A directory of <version>.bin; the newest file is the image offered.
  dir: firmware
  # true also offers to boards not built from a tag. For a bench board only.
  offer_dev_builds: false
  # Optional. Without it, copy an image into dir yourself. With it, the
  # server watches the repository's releases and takes the named asset.
  # source:
  #   github: chrisjtwomey/inkplate10-weather-cal
  #   asset: firmware.bin
  #   poll_seconds: 3600
  #   token: ""     # a private repository; prefer FIRMWARE_SOURCE_TOKEN
mqtt:
  enabled: false
  host: localhost
  port: 1883
  topic: mqtt/eink-cal-client