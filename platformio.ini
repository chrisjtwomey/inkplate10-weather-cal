; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Limit `pio run` (no -e flag) to firmware envs only.
; `native` is excluded because it has no main() — it's only valid via `pio test -e native`.
[platformio]
default_envs = debug, release

; Settings shared by every firmware build target the ESP32. The host-only
; `native` env at the bottom intentionally does NOT extend this, so `pio test
; -e native` can compile pure helpers without pulling in ESP32 deps.
[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32dev
board_build.f_cpu = 240000000L
; defaults.example.cpp is a template for src/defaults.cpp; excluded from
; firmware builds to avoid duplicate-symbol link errors.
build_src_filter = +<*> -<defaults.example.cpp>
lib_deps =
	androbi/MqttLogger@^0.2.3
	knolleary/PubSubClient@^2.8
	tobozo/YAMLDuino @ ^1.5.0
	e-radionicacom/InkplateLibrary@^11.0.0
	https://github.com/bblanchon/ArduinoStreamUtils.git#v1.9.2
	bblanchon/ArduinoJson @ ^7.4.0
	ropg/ezTime @ ^0.8.3
	smfsw/Queue @ ^1.11

[env:debug]
extends = esp32_common
monitor_filters = esp32_exception_decoder
build_type = debug
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE10
	-DBOARD_HAS_PSRAM
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-mfix-esp32-psram-cache-issue
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=5
	-DCORE_DEBUG_LEVEL=4

[env:release]
extends = esp32_common
build_type = release
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE10
	-DBOARD_HAS_PSRAM
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-mfix-esp32-psram-cache-issue
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on E-Radionica Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

[env:release_sdcard]
extends = esp32_common
build_type = release
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE10
	-DBOARD_HAS_PSRAM
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-mfix-esp32-psram-cache-issue
	-DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

[env:native]
; Host-only test environment for the pure helpers (`pio test -e native`).
; Doesn't extend `esp32_common`, so no ESP32 board / framework / libs leak in.
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++11 -Iinclude
build_src_filter = +<battery.cpp> +<refresh_header.cpp> +<backoff.cpp>