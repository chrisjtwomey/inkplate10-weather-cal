; PlatformIO Project Configuration File
;
; This project is a consumer of the epd libraries:
;   EpdClient        — the hardware-agnostic client firmware (IBoard, the
;                      steps of a wake)
;   EpdBoardInkplate — the Inkplate IBoard implementation
;
; Everything in src/ is project-specific: the board choice (main.cpp), the
; order of a wake and what to do when one fails (app.cpp), and the
; credentials / server URL (defaults.cpp).
;
; The kit's own tests live in the epd repo. The sequence of a wake is this
; project's, so its test lives here: `pio test -e native_integration`.
;
; Each environment named *-dev builds the same thing against a checkout of
; epd beside this repo, so a change to epd can be tried here before it is
; released.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = debug, release

[epd]
; epd, from the PlatformIO registry at the release server/requirements.txt
; pins: the firmware and the server share the header contract.
client = chrisjtwomey/EpdClient @ 0.14.0
inkplate = chrisjtwomey/EpdBoardInkplate @ 0.14.0
checkout =
	symlink://../epd/firmware
	symlink://../epd/firmware/boards/inkplate

[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32dev
board_build.f_cpu = 240000000L
; defaults.example.cpp is a template for src/defaults.cpp; excluded from
; firmware builds to avoid duplicate-symbol link errors.
build_src_filter = +<*> -<defaults.example.cpp>
; Tests run on the host only; do not try to upload them to the board.
test_ignore = *
; Derives CLIENT_VERSION from git describe. See scripts/version.py.
extra_scripts = pre:scripts/version.py
lib_deps =
	${epd.client}
	${epd.inkplate}

[inkplate10_flags]
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE10
	-DCLIENT_NAME='"inkplate10-weather-cal"'
	-DBOARD_HAS_PSRAM
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-mfix-esp32-psram-cache-issue

[env:debug]
extends = esp32_common
monitor_filters = esp32_exception_decoder
build_type = debug
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=5
	-DCORE_DEBUG_LEVEL=4

[env:debug-dev]
extends = env:debug
lib_deps = ${epd.checkout}

[env:release]
extends = esp32_common
build_type = release
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on E-Radionica Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

[env:release_sdcard]
extends = esp32_common
build_type = release
; YAML config loading is only reachable on the USE_SDCARD path, so these are
; declared here rather than as hard dependencies of EpdClient.
lib_deps =
	${esp32_common.lib_deps}
	tobozo/YAMLDuino @ ^1.5.0
	https://github.com/bblanchon/ArduinoStreamUtils.git#v1.9.2
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	-DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

; The host tests compile epd's sources from the EpdClient package: lib_deps
; downloads it, `epd` names its folder, and lib_ignore keeps PlatformIO from
; building the whole library for the host. Each -dev twin points `epd` at the
; checkout instead.

[env:native_panel]
; What this project draws over a page, on the host. panel.cpp is this
; project's own: it picks the fonts and the icons, and only it knows which
; colour constants its panel uses. BLACK and WHITE come from the Inkplate
; driver on a real build and differ between panels, so they are given values
; here purely to compile; no test depends on what they are.
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_panel
lib_deps = ${epd.client}
lib_ignore = EpdClient
epd = ${platformio.libdeps_dir}/${this.__env__}/EpdClient
build_flags =
	-std=c++14
	-Iinclude
	-I${this.epd}/include
	-I${this.epd}/test_support
	-DLOG_LEVEL=0
	-DNATIVE
	-DBLACK=1
	-DWHITE=0
build_src_filter =
	+<panel.cpp>
	+<${this.epd}/src/epd.cpp>

[env:native_panel-dev]
extends = env:native_panel
lib_deps =
epd = ${PROJECT_DIR}/../epd/firmware

[env:native_integration]
; run_app()'s control flow, on the host. It compiles this project's app.cpp
; against the kit's wake steps, with every hardware-dependent free function
; replaced by a stub in test/test_integration/stubs.cpp and the config
; symbols by test_defaults.cpp. The stub headers and MockBoard come from the
; kit, which ships them for exactly this.
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_integration
lib_deps = ${epd.client}
lib_ignore = EpdClient
epd = ${platformio.libdeps_dir}/${this.__env__}/EpdClient
build_flags =
	-std=c++14
	-Iinclude
	-I${this.epd}/include
	-I${this.epd}/test_support
	-Itest/test_integration
	-DLOG_LEVEL=0
	-DNATIVE
build_src_filter =
	+<app.cpp>
	+<${this.epd}/src/epd.cpp>
	+<${this.epd}/src/wake.cpp>
	+<${this.epd}/src/sd_config.cpp>
	+<${this.epd}/src/ota_offer.cpp>
	+<${this.epd}/src/backoff.cpp>
	+<${this.epd}/src/mqtt_topic.cpp>
	+<${this.epd}/src/user_agent.cpp>

[env:native_integration-dev]
extends = env:native_integration
lib_deps =
epd = ${PROJECT_DIR}/../epd/firmware
