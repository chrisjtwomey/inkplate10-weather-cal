; PlatformIO Project Configuration File
;
; This project is now a thin consumer of the epd libraries:
;   EpdClient        — the hardware-agnostic client firmware (IBoard, run_app)
;   EpdBoardInkplate — the Inkplate IBoard implementation
;
; Everything left in src/ is project-specific: the board choice (main.cpp) and
; the credentials / server URL (defaults.cpp).
;
; The client's unit and integration tests live with the code they cover, in
; the epd repo. Run them there with `pio test`.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = debug, release

[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32dev
board_build.f_cpu = 240000000L
; defaults.example.cpp is a template for src/defaults.cpp; excluded from
; firmware builds to avoid duplicate-symbol link errors.
build_src_filter = +<*> -<defaults.example.cpp>
; Derives CLIENT_VERSION from git describe. See scripts/version.py.
extra_scripts = pre:scripts/version.py
; Local checkouts during development. For a pinned release, swap these for:
;   https://github.com/chrisjtwomey/epd.git#v0.1.0
lib_deps =
	symlink://../epd/firmware
	symlink://../epd/firmware/boards/inkplate

[inkplate10_flags]
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE10
	-DBOARD_HAS_PSRAM
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-mfix-esp32-psram-cache-issue

[env:debug]
extends = esp32_common
monitor_filters = esp32_exception_decoder
build_type = debug
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=5
	-DCORE_DEBUG_LEVEL=4

[env:release]
extends = esp32_common
build_type = release
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	# uncomment below if you want to use an SD card
	# WARNING: high power consumption on E-Radionica Inkplate10 V1
	# -DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

[env:release_sdcard]
extends = esp32_common
build_type = release
; YAML config loading is only reachable on the USE_SDCARD path, so these are
; declared here rather than as hard dependencies of EpdClient.
lib_deps =
	${esp32_common.lib_deps}
	tobozo/YAMLDuino @ ^1.5.0
	https://github.com/bblanchon/ArduinoStreamUtils.git#v1.9.2
build_unflags = ${inkplate10_flags.build_unflags}
build_flags =
	${inkplate10_flags.build_flags}
	-DUSE_SDCARD
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0
